services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 10s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '5001:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/bookhaven?replicaSet=rs0
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: dev-access-secret-min-32-characters-long!
      JWT_REFRESH_SECRET: dev-refresh-secret-min-32-characters-long
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo_data:
